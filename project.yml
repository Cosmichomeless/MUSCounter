name: MUSCounter
options:
  bundleIdPrefix: com.cosmichomeless
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MusCore:
    path: Packages/MusCore
  MusAds:
    path: Packages/MusAds

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  MUSCounter:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MusCore
      - package: MusAds
    info:
      path: Generated/MUSCounter-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Anuncios (AdMob). Los identificadores vienen de los .xcconfig; los reales, de Secrets.xcconfig.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        MusAdBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
