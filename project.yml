name: MUSCounter
options:
  bundleIdPrefix: com.cosmichomeless
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MusCore:
    path: Packages/MusCore

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  MUSCounter:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MusCore
    info:
      path: Generated/MUSCounter-Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PRODUCT_BUNDLE_IDENTIFIER)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MUSCounterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/AppTests
    dependencies:
      - target: MUSCounter
      - package: MusCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cosmichomeless.muscounter.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  MUSCounter:
    build:
      targets:
        MUSCounter: all
        MUSCounterTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MUSCounterTests
    archive:
      config: Release
